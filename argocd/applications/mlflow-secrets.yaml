# In production mode use strong passwords and add this file to gitignore
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-secrets
  namespace: mlflow
type: Opaque
stringData:
  # --- PostgreSQL (Bitnami PostgreSQL chart) ---
  # Superuser (admin) password for the built-in "postgres" user
  postgres-password: "admin-password-9"
  # App DB credentials (used by MLflow server)
  db-username: "mlflow"
  db-password: "db-password-9"

  # --- MinIO (Bitnami MinIO chart) ---
  root-user: "minio-user"
  root-password: "minio-password-9"

  # --- MLflow UI basic auth (community chart) ---
  admin-username: "admin"
  admin-password: "mlflow-password-9"
